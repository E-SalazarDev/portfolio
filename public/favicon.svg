<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo cuadrado redondeado oscuro -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="#0E1219"/>

  <!-- Letra E blanca, más grande y centrada -->
  <path d="M 28 30 H 84 V 44 H 46 V 56 H 76 V 70 H 46 V 84 H 84 V 98 H 28 Z"
        fill="#F5F6F7"/>

  <!-- Onda cyan a la derecha (trazo grueso para que se vea a 16px) -->
  <path d="M 84 30 Q 108 46 84 64 Q 72 72 84 82 Q 108 100 84 114"
        fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>

  <!-- Punto cyan (nodo) -->
  <circle cx="106" cy="72" r="6" fill="#0E1219" stroke="#22D3EE" stroke-width="5"/>
</svg>